<!-- api-gateway/static/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallet Service API Documentation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        #topbar {
            padding: 10px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ddd;
        }
        #topbar select {
            padding: 8px;
            font-size: 16px;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@4/swagger-ui.css" />
</head>
<body>
    <div id="topbar">
        <select id="spec-selector">
            <option value="/swagger/asset_service.swagger.json" selected>Asset Service</option>
            <option value="/swagger/wallet_service.swagger.json">Wallet Service</option>
            <option value="/swagger/user_service.swagger.json">User Service</option>
        </select>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@4/swagger-ui-bundle.js" crossorigin></script>
    <script>
        window.onload = () => {
            const selector = document.getElementById('spec-selector');

            const loadSwagger = (url) => {
                window.ui = SwaggerUIBundle({
                    url: url,
                    dom_id: '#swagger-ui',
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIBundle.SwaggerUIStandalonePreset
                    ]
                    // The "layout" is provided by the StandalonePreset,
                    // so we don't need to specify it again.
                });
            };

            // Load the default spec on page load
            loadSwagger(selector.value);

            // Reload Swagger when the dropdown selection changes
            selector.addEventListener('change', (e) => {
                loadSwagger(e.target.value);
            });
        };
    </script>
</body>
</html>
